<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Sara ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    background: rgba(255,255,255,0.15);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    color: white;
    backdrop-filter: blur(10px);
}

h1 {
    font-size: 32px;
}

p {
    font-size: 18px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#yes {
    background-color: #28a745;
    color: white;
}

#no {
    background-color: #dc3545;
    color: white;
    position: relative;
}

/* floating hearts */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Sara Enemune❤️</h1>
    <p>From the moment I met you, my world became more beautiful.</p>
    <p>Your smile, your kindness, everything about you is special to me.</p>
    <h2>Will you be my Valentine? 💖</h2>

    <button id="yes">Yes ❤️</button>
    <button id="no">No 💔</button>
</div>

<script>
// moving no button
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * 300 - 150;
    const y = Math.random() * 300 - 150;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

// yes button action
document.getElementById("yes").addEventListener("click", function() {
    document.body.innerHTML = `
        <div style="text-align:center;color:white;margin-top:20%;">
            <h1>Yay Sara! ❤️</h1>
            <h2>You just made me the happiest person alive! 💕</h2>
            <p>I can't wait to spend beautiful moments with you 💖</p>
        </div>
    `;
});

// floating hearts generator
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
